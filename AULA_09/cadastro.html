<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Cadastro de Usuario</title>

</head>
<body>

    <h1>Cadastro</h1>

    <label for="nome">Nome</label>
    <input id="nome" type="text"><br>

    <label for="usuario">Usuário</label>

    <input id="palavra_passe" type="text"><br>

    <p id="mensagem"></p>

    <button onclick="cadastro()">Cadastrar</button>

</html>
